<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Options Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#121417; --raise:#171a1e; --hover:#1c2025; --line:#23272d; --line2:#2e333a;
  --text:#e4e6e9; --muted:#878d96; --dim:#565c64; --call:#4fd1a1; --put:#f0716a; --sweep:#e3bf6b; --focus:#9fb4ff;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit} button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select{background:transparent;border:1px solid var(--line2);border-radius:5px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--focus)}
select option{background:var(--raise)}
.btn{border:1px solid var(--line2);background:transparent;border-radius:5px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);border-color:#454b54}
.btn.pri{background:var(--text);border-color:var(--text);color:var(--bg)} .btn.pri:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:default}
header{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header svg{width:24px;height:24px}
header h1{font-size:17px;font-weight:600;margin:0;font-variation-settings:"wdth" 112;letter-spacing:-.01em}
header .who{color:var(--muted);font-size:13px;margin-left:auto}
main{padding:24px 28px 48px;max-width:1500px}
.gate{max-width:440px;margin:9vh auto 0;padding:0 4px}
.gate h2{font-size:24px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em;font-variation-settings:"wdth" 112}
.gate p{color:var(--muted);margin:0 0 18px}
.gate ol{color:var(--muted);padding-left:20px;margin:0 0 20px} .gate li{margin-bottom:6px} .gate li b{color:var(--text);font-weight:500}
.code{font-size:28px;letter-spacing:.4em;text-align:center;width:100%;padding:12px;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 115}
.err{color:var(--put);font-size:13px;min-height:20px;margin:10px 0}
.qr{background:#fff;padding:14px;border-radius:8px;display:inline-block;margin:4px 0 14px}
.secret{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--text);border:1px dashed var(--line2);border-radius:5px;padding:8px 10px;word-break:break-all;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:4px 0 26px}
.stat{padding:2px 22px;border-left:1px solid var(--line)} .stat:first-child{padding-left:0;border-left:0}
.stat .k{color:var(--muted);font-size:12.5px}
.stat .v{font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 125;line-height:1.15}
.stat .s{color:var(--muted);font-size:12px;margin-top:4px}
.note{color:var(--muted);font-size:13px;margin:-10px 0 22px}
.warn{border-left:2px solid var(--sweep);padding:8px 12px;color:var(--text);font-size:13px;margin:0 0 22px;background:rgba(227,191,107,.06)}
h3{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:10px}
.sechead{display:flex;align-items:center;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.sechead .sp{flex:1}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px}
.tw{overflow:auto;max-height:62vh;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 94}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--bg);color:var(--muted);font-weight:500;font-size:12px;box-shadow:inset 0 -1px 0 var(--line2);border-bottom:0}
td.n,th.n{text-align:right}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--hover)}
.u b{font-weight:600;display:block} .u span{color:var(--muted);font-size:12px}
.m{color:var(--muted)} .d{color:var(--dim)} .g{color:var(--call)}
.tag{font-size:12px;border:1px solid var(--line2);border-radius:4px;padding:1px 7px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px!important;white-space:normal}
.overlay{position:fixed;inset:0;background:rgba(6,7,9,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--raise);border-left:1px solid var(--line2);z-index:30;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.overlay{transition:none}}
.dh{display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis}
.db{overflow:auto;padding:4px 24px 24px}
.sec{padding:18px 0;border-bottom:1px solid var(--line)} .sec:last-child{border-bottom:0}
.sec h4{margin:0 0 10px;font-size:13px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.kv .k{color:var(--muted);font-size:12px} .kv .v{font-size:15px;font-weight:500}
.kv .v{overflow-wrap:anywhere} .pic{width:48px;height:48px;border-radius:50%;display:block;margin:0 0 14px} .sec p.m{font-size:12px;margin:12px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:5px;cursor:pointer;font-size:18px}
.x:hover{background:var(--hover);color:var(--text)}
@media (max-width:1100px){ .grid{grid-template-columns:1fr} }
@media (max-width:760px){ header,main{padding-left:16px;padding-right:16px} .stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px} .stat:nth-child(odd){padding-left:0;border-left:0} .kv{grid-template-columns:repeat(2,1fr)} header .who{display:none} }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18.5c3.5 0 4.5-11 10-11s6.5 11 10 11"/><path d="M3 22.5h20" stroke-opacity=".35"/></svg>
  <h1>Admin</h1>
  <span class="who" id="who"></span>
  <a class="btn" href="/">Open app</a>
  <button class="btn" id="lock" hidden>Lock</button>
  <a class="btn" href="/api/auth/logout">Sign out</a>
</header>
<main id="main"><p class="m">Loading…</p></main>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="User details">
  <div class="dh"><h2 id="dTitle"></h2><button class="x" id="dClose" aria-label="Close">×</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script src="/js/admin.js"></script>
</body>
</html>
