<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Options Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#141518; --rail:#1c1d20; --panel:#232428; --panel2:#2a2b30; --row:#1f2023; --row2:#25262a; --line:#33343a;
  --text:#ececee; --muted:#8c8e96; --dim:#5d5f66;
  --green:#22e07a; --red:#ff4b55; --yellow:#f5c518; --purple:#c58bff; --blue:#4c8dff; --cyan:#41c7ff; --accent:#f2b51d;
  --font: Rubik, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--font)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
select option{background:var(--panel)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0}
.app{display:grid;grid-template-columns:64px 1fr 300px;height:100vh;overflow:hidden}
.app.nofeed{grid-template-columns:64px 1fr}
/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;border-right:1px solid #0f1012}
.logo{width:34px;height:34px;margin-bottom:18px}
.rail button{width:64px;height:54px;border:0;background:none;color:var(--muted);display:grid;place-items:center;position:relative}
.rail button:hover{color:var(--text)}
.rail button.on{color:var(--text);background:var(--panel)}
.rail button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.rail svg{width:24px;height:24px}
.rail .tip{position:absolute;left:58px;background:#000;color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:30}
.rail button:hover .tip{opacity:1}
.rail .sp{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--accent)}
/* main */
.main{overflow:auto;padding:14px 16px 24px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:#000;color:#fff;display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.vtitle{font-weight:600;font-size:16px;margin:0 6px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.live{background:var(--green)} .dot.delayed{background:var(--yellow)} .dot.err{background:var(--red)} .dot.demo{background:var(--purple)}
.spacer{flex:1}
.search{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2)}
.search input{border:0;border-radius:0;width:190px;background:transparent;text-transform:uppercase}
.search input::placeholder{text-transform:none}
.search button{border:0;border-left:1px solid var(--line);background:transparent;width:40px;display:grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.dark{background:#000;border-color:#000;color:#fff;display:flex;align-items:center;gap:8px}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#141518;font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.badge{background:var(--accent);color:#141518;border-radius:9px;font-size:11px;font-weight:700;padding:1px 6px}
#msg{font-size:13px;color:var(--muted);margin:-4px 2px 10px} #msg:empty{display:none} #msg.err{color:#ff8a92}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--panel);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:96px}
.card .k{color:var(--muted);font-size:13px;margin-bottom:6px}
.card .v{font-size:24px;font-weight:600;letter-spacing:.2px}
.card .s{font-size:12px;color:var(--muted);margin-top:2px}
.sbar{width:120px;height:10px;border-radius:6px;background:#3a3b41;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .4s}
.ring{width:64px;height:64px;flex:none}
/* tables */
.tablewrap{background:var(--row);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#111214;color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.4px;text-transform:uppercase;z-index:2;cursor:pointer;user-select:none}
th.on{color:var(--accent)}
tbody tr:nth-child(even) td{background:var(--row2)}
tbody tr:hover td{background:#303137!important}
td.num,th.num{text-align:right}
.t-dim{color:var(--dim)}
.c-green{color:var(--green)} .c-red{color:var(--red)} .c-cyan{color:var(--cyan)} .c-yellow{color:var(--yellow)} .c-purple{color:var(--purple)} .c-blue{color:var(--blue)} .c-muted{color:var(--muted)}
tr.hot td{background:linear-gradient(180deg,rgba(242,140,40,.0),rgba(242,140,40,.16))!important;border-bottom:1px solid rgba(242,140,40,.6)}
tr.gold td{background:linear-gradient(180deg,rgba(197,139,255,.0),rgba(197,139,255,.14))!important;border-bottom:1px solid rgba(197,139,255,.55)}
tr.new td{animation:newrow 1.6s ease-out}
@keyframes newrow{from{background:rgba(242,181,29,.22)}}
.more{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 6px}
.more:hover{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:40px!important}
/* chain */
.chain td,.chain th{text-align:right;padding:8px 10px}
.chain td.k,.chain th.k{text-align:center;font-weight:600;background:#17181b!important}
.chain th.c{color:#8fc3ff} .chain th.p{color:#ffaab0}
.chain td.itm{background:rgba(76,141,255,.08)!important}
.chain tr.atm td{background:rgba(242,181,29,.14)!important}
td.star{width:28px;text-align:center;color:var(--dim);cursor:pointer}
td.star.on{color:var(--accent)} td.star:hover{color:var(--text)}
tr.grp td{background:#111214!important;color:var(--muted);font-weight:600}
tr.grp td b{color:var(--text);margin-right:10px}
@keyframes fu{0%,40%{color:var(--green)}} @keyframes fd{0%,40%{color:var(--red)}}
.fu{animation:fu 1.4s} .fd{animation:fd 1.4s}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:12px;font-size:13px}
.row label{color:var(--muted);display:flex;align-items:center;gap:6px}
.row input[type=number]{width:76px}
.view{display:none} .view.on{display:block}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
.chartbox{background:var(--panel);border-radius:10px;padding:14px}
.chartbox h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.cw{position:relative;height:280px}
/* feed */
.feed{background:var(--bg);border-left:1px solid #0f1012;display:flex;flex-direction:column;min-width:0}
.feedhead{display:flex;align-items:center;gap:8px;background:var(--panel);margin:14px 12px 8px;border-radius:10px;padding:10px 12px}
.feedhead .t{font-weight:600}
.feedhead select{padding:4px 6px;font-size:12px}
.feedlist{overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.fcard{background:var(--panel);border-radius:10px;padding:12px 14px;font-size:13px;cursor:pointer}
.fcard:hover{background:var(--panel2)}
.fcard .top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}
.fcard .grid{display:grid;grid-template-columns:repeat(4,auto);gap:2px 10px}
.fcard .h{color:var(--dim);font-size:11px;text-transform:uppercase}
.fcard .d{font-size:11px;color:var(--dim);margin-top:6px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--purple);display:inline-block}
/* menu */
.menu{position:fixed;z-index:40;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--panel)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100vw);background:var(--bg);z-index:60;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:17px;font-weight:600}
.dbody{flex:1;overflow:auto;padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
.fsec{background:var(--panel);border-radius:10px;padding:14px}
.fsec h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.frow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.frow>span{color:var(--muted)}
.frow .pair{display:flex;gap:6px;align-items:center}
.frow .pair input{width:100%}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.checks label{display:flex;align-items:center;gap:5px}
.dfoot{border-top:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#18191c}
.dfoot select{min-width:200px}
.dfoot input{width:200px}
.savestate{font-size:12px;color:var(--muted)}
.ins{width:min(560px,100vw)}
.ins .dbody{display:block}
.ins .sec{background:var(--panel);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.ins .sec h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.ins .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ins .big{font-size:26px;font-weight:600}
.ins .tag{font-size:12px;border-radius:5px;padding:2px 7px;background:var(--panel2);color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;font-variant-numeric:tabular-nums}
.kv .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.kv .v{font-size:15px;font-weight:500}
.ins ul.pts{margin:0;padding:0;list-style:none}
.ins ul.pts li{position:relative;padding:6px 0 6px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.ins ul.pts li:last-child{border-bottom:0}
.ins ul.pts li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ins ul.pts li.g::before{background:var(--green)} .ins ul.pts li.r::before{background:var(--red)}
.ins .acts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.mini{width:100%;font-size:13px}
.mini td,.mini th{padding:7px 8px}
.mini tbody tr{cursor:pointer}
.news{display:flex;flex-direction:column;gap:10px}
.nitem{display:block;text-decoration:none;background:var(--panel2);border-radius:8px;padding:11px 12px}
.nitem:hover{background:#34353b}
.nitem .src{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:4px}
.nitem .src img{width:14px;height:14px;border-radius:3px}
.nitem .tt{font-weight:500;font-size:14px;margin-bottom:4px}
.nitem .sm{color:#b9bbc2;font-size:13px}
.brief{white-space:pre-wrap;font-size:13.5px;line-height:1.55}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cites a{font-size:11.5px;color:var(--muted);background:var(--panel2);border-radius:5px;padding:3px 7px;text-decoration:none}
.cites a:hover{color:var(--text)}
.skel{height:12px;border-radius:5px;background:linear-gradient(90deg,#2a2b30,#34353b,#2a2b30);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.payoff{width:100%;height:150px}
.clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
@media (max-width:1280px){ .app{grid-template-columns:64px 1fr} .feed{display:none} }
@media (max-width:900px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .dbody{grid-template-columns:1fr} .charts{grid-template-columns:1fr} }
@media (max-width:640px){
  .app{grid-template-columns:1fr;height:auto;min-height:100vh;overflow:visible}
  .rail{position:fixed;left:0;right:0;bottom:0;height:58px;flex-direction:row;justify-content:space-around;padding:0;z-index:20;border-right:0;border-top:1px solid #0f1012}
  .rail .logo,.rail .sp,.rail .avatar,.rail .tip{display:none}
  .rail button{width:auto;flex:1;height:58px} .rail button.on::before{left:20%;right:20%;top:0;bottom:auto;width:auto;height:3px}
  .main{padding:10px 12px 76px;overflow:visible}
  .search input{width:120px}
  .card .v{font-size:19px} .ring{width:52px;height:52px}
  .tablewrap{max-height:none}
  .frow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Bölümler">
    <svg class="logo" viewBox="0 0 40 40" aria-label="Options Screener"><rect x="4" y="4" width="32" height="32" rx="9" fill="#f2b51d"/><path d="M12 26 L18 18 L22 22 L29 12" stroke="#141518" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="12" r="2.4" fill="#141518"/></svg>
    <button data-view="flow" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="tip">Opsiyon akışı</span></button>
    <button data-view="chain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="tip">Opsiyon zinciri</span></button>
    <button data-view="screener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7"/></svg><span class="tip">Kontrat tarayıcı</span></button>
    <button data-view="tracked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l7.5 4.2L12 12 4.5 7.7z"/><path d="M4.5 12L12 16.3 19.5 12M4.5 16.3L12 20.5l7.5-4.2"/></svg><span class="tip">Takip listem</span></button>
    <button data-view="stocks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20V11M12 20V5M18 20v-7"/></svg><span class="tip">Hisseler</span></button>
    <button data-view="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7 15l4-4 3 3 5-6"/></svg><span class="tip">Grafikler</span></button>
    <span class="sp"></span>
    <a href="/api/auth/logout" title="Çıkış" style="text-decoration:none"><span class="avatar" id="avatar">?</span></a>
  </nav>

  <main class="main">
    <div class="topbar">
      <span class="vtitle" id="vtitle">Opsiyon akışı</span>
      <span class="status"><span class="dot" id="dot"></span><span id="status">Bağlanıyor</span></span>
      <span class="status" id="rate"></span>
      <span class="spacer"></span>
      <form class="search" id="searchForm"><input id="tk" placeholder="Sembol ara" autocomplete="off" aria-label="Sembol"><button aria-label="Ara"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg></button></form>
      <select id="quickPreset" aria-label="Kayıtlı filtre" title="Kayıtlı filtreler"></select>
      <button class="btn" id="clearAll">Temizle</button>
      <button class="btn dark" id="openFilters"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>Filtreler <span class="badge" id="fcount" hidden></span></button>
    </div>
    <div id="msg"></div>

    <section class="view on" id="v-flow">
      <div class="stats" id="stats"></div>
      <div class="tablewrap" id="flowWrap"><table><thead id="flowHead"></thead><tbody id="flowBody"></tbody></table></div>
    </section>

    <section class="view" id="v-chain">
      <div class="stats" id="ustats"></div>
      <div class="row"><label>Vade <select id="expSel"></select></label><span class="c-muted" id="chainInfo"></span><span class="c-muted">☆ ile kontratı takibe al</span></div>
      <div class="tablewrap" id="chainWrap"><table class="chain">
        <thead><tr><th></th><th class="c">OI</th><th class="c">Hacim</th><th class="c">IV</th><th class="c">Δ</th><th class="c">Bid</th><th class="c">Ask</th><th class="c">Son</th><th class="k">Strike</th><th class="p">Son</th><th class="p">Bid</th><th class="p">Ask</th><th class="p">Δ</th><th class="p">IV</th><th class="p">Hacim</th><th class="p">OI</th><th></th></tr></thead>
        <tbody id="chainBody"></tbody></table></div>
    </section>

    <section class="view" id="v-screener">
      <div class="row" id="sbar">
        <label>Tip <select id="sType"><option value="all">Hepsi</option><option value="C">Call</option><option value="P">Put</option></select></label>
        <label>DTE <input id="sDteMin" type="number" placeholder="min"> – <input id="sDteMax" type="number" placeholder="maks"></label>
        <label>|Δ| <input id="sDMin" type="number" step="0.05" placeholder="min"> – <input id="sDMax" type="number" step="0.05" placeholder="maks"></label>
        <label>Min OI <input id="sOi" type="number"></label>
        <label>Min hacim <input id="sVol" type="number"></label>
        <label>Maks spread % <input id="sSpr" type="number"></label>
        <label>IV % <input id="sIvMin" type="number" placeholder="min"> – <input id="sIvMax" type="number" placeholder="maks"></label>
        <label><input id="sUnusual" type="checkbox"> Olağandışı hacim</label>
        <span class="c-muted" id="scrInfo"></span>
      </div>
      <div class="tablewrap"><table><thead id="scrHead"></thead><tbody id="scrBody"></tbody></table></div>
    </section>

    <section class="view" id="v-tracked">
      <div class="row"><span class="c-muted" id="trkInfo">Zincirde, tarayıcıda ya da akışta ☆ / ⋯ ile kontrat ekle.</span></div>
      <div class="tablewrap"><table><thead id="trkHead"></thead><tbody id="trkBody"></tbody></table></div>
    </section>

    <section class="view" id="v-stocks">
      <div class="row"><label style="flex:1">İzleme listesi <input id="watchInp" style="flex:1"></label></div>
      <div class="tablewrap"><table><thead id="stHead"></thead><tbody id="stBody"></tbody></table></div>
    </section>

    <section class="view" id="v-charts">
      <div class="charts">
        <div class="chartbox"><h3 id="ivTitle">IV eğrisi</h3><div class="cw"><canvas id="ivChart"></canvas></div></div>
        <div class="chartbox"><h3 id="oiTitle">Açık pozisyon</h3><div class="cw"><canvas id="oiChart"></canvas></div></div>
        <div class="chartbox"><h3 id="vlTitle">Hacim</h3><div class="cw"><canvas id="vlChart"></canvas></div></div>
        <div class="chartbox"><h3>Akış primi: call / put (dakikalık)</h3><div class="cw"><canvas id="flowChart"></canvas></div></div>
      </div>
    </section>
  </main>

  <aside class="feed" id="feed">
    <div class="feedhead"><span class="pdot"></span><span class="t">Büyük işlemler</span><span class="spacer"></span>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const MONTHS = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
let DEMO = location.protocol==='file:' || new URLSearchParams(location.search).has('demo');
const CFG = { maxDte:60, strikePct:15, maxContracts:3000, pollMs:2000, fullMs:60000, maxFlows:1500 };
const ETFS = new Set(['SPY','QQQ','IWM','DIA','XLF','XLE','XLK','XLV','XLI','XLY','XLP','XLU','XLB','XLRE','SMH','SOXX','TLT','HYG','LQD','GLD','SLV','USO','UNG','EEM','EFA','FXI','KWEB','ARKK','VXX','UVXY','SQQQ','TQQQ','SPXL','SOXL','IBIT','GDX','XBI','KRE']);

/* ---------- preferences: local cache + per-user cloud copy ---------- */
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
const FLOW0 = { sym:'', exclude:'', watchOnly:false, stockType:'all', spotMin:'', spotMax:'', earnings:'any',
  cp:'all', tSweep:true, tSplit:true, tBlock:true, tOther:true, minSize:'', minPrice:'', minPrem:'', maxPrem:'', side:'any', dir:'any',
  dteMin:'', dteMax:'', money:'any', otmMin:'', otmMax:'', volGtOi:false, volOiMin:'', oiMin:'', repeatMin:'', repeatPremMin:'' };
const SCR0 = { type:'all', dteMin:'', dteMax:'', dMin:'', dMax:'', oi:'', vol:'', spr:'', ivMin:'', ivMax:'', unusual:false };
const PDEF = { und:'SPY', watch:'SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA,AMZN,META,AMD', sortKey:'vol', sortDir:-1, flowSort:'t', flowDir:-1,
  tracked:[], presets:[], defaultPreset:null, activePreset:null, flow:{...FLOW0}, scr:{...SCR0}, view:'flow', bigMin:'1000000' };
let P = Object.assign({}, PDEF);
try{ const s=JSON.parse(store('os.prefs2')||'{}'); P=Object.assign({},PDEF,s,{flow:{...FLOW0,...(s.flow||{})},scr:{...SCR0,...(s.scr||{})}}); }catch(e){}
if(!Array.isArray(P.tracked)) P.tracked=[]; if(!Array.isArray(P.presets)) P.presets=[];
const CLOUD = { configured:false, ready:false, saving:false, timer:null, err:null };
function saveP(cloudToo){ store('os.prefs2', JSON.stringify(P)); if(cloudToo) cloudSave(); }
function cloudPayload(){ return { presets:P.presets, tracked:P.tracked, watch:P.watch, defaultPreset:P.defaultPreset }; }
function cloudSave(){
  if(DEMO_LOCAL()) { paintSaveState(); return; }
  if(!CLOUD.configured||!CLOUD.ready) { paintSaveState(); return; }
  clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(async()=>{ CLOUD.saving=true; paintSaveState();
    try{ const r=await fetch('/api/userdata',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(cloudPayload())});
      const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||r.statusText); CLOUD.err=null; }
    catch(e){ CLOUD.err=e.message; }
    CLOUD.saving=false; paintSaveState(); },700); }
const DEMO_LOCAL = () => location.protocol==='file:';
async function cloudLoad(){
  if(DEMO_LOCAL()) return;
  try{ const r=await fetch('/api/userdata',{credentials:'same-origin',cache:'no-store'}); const j=await r.json();
    CLOUD.configured=!!j.configured;
    if(!CLOUD.configured){ paintSaveState(); return; }
    if(!r.ok) throw new Error(j.error||r.statusText);
    const d=j.data;
    if(d){ P.presets=d.presets||[]; P.tracked=d.tracked||[]; if(d.watch) P.watch=d.watch; P.defaultPreset=d.defaultPreset||null; saveP(false); CLOUD.ready=true; }
    else { CLOUD.ready=true; if(P.presets.length||P.tracked.length) cloudSave(); } // first use: upload what this browser has
  }catch(e){ CLOUD.err=e.message; }
  paintSaveState();
}
function paintSaveState(){
  const t = DEMO_LOCAL() ? 'Yerel önizleme: kayıtlar bu tarayıcıda.'
    : !CLOUD.configured ? 'Veritabanı henüz bağlı değil: filtreler şimdilik bu tarayıcıda saklanıyor.'
    : CLOUD.err ? 'Kaydedilemedi: '+CLOUD.err
    : CLOUD.saving ? 'Kaydediliyor…' : 'Filtrelerin hesabına kayıtlı; her cihazda aynı.';
  $('#saveState').textContent=t; $('#saveState').style.color=CLOUD.err?'var(--red)':'';
}

/* ---------- state ---------- */
const S = { und:P.und, uPrice:null, uChg:null, uChgPct:null, contracts:new Map(), selExp:null, dirty:new Set(),
  cellMap:new Map(), starMap:new Map(), chainRows:[], scrRows:new Map(), scrTop:[], lastScr:0, scrForce:true,
  stocks:new Map(), stRows:new Map(), stDirty:new Set(), trk:new Map(), trkU:new Map(), trkRows:new Map(), trkForce:true,
  flows:[], flowDirty:true, repeat:new Map(), newIds:new Set(), lastFlowRender:0, prevVol:new Map(), flowRot:0,
  upd:0, rate:0, lastUpd:null, timers:[], flowTimers:[], polling:false, loadingFull:false, charts:{}, lastCharts:0, lastItm:null, gen:0, delayed:null, fails:0 };

/* ---------- formatting ---------- */
const ok = v => v!=null && isFinite(v);
const f2 = v => ok(v) ? v.toFixed(2) : '–';
const f3 = v => ok(v) ? v.toFixed(3) : '–';
const f4 = v => ok(v) ? v.toFixed(4) : '–';
const fInt = v => ok(v) ? Math.round(v).toLocaleString('en-US') : '–';
const fPct = v => ok(v) ? v.toFixed(1)+'%' : '–';
const fSPct = v => ok(v) ? (v>0?'+':'')+v.toFixed(2)+'%' : '–';
const fIV = v => ok(v) ? (v*100).toFixed(1)+'%' : '–';
const fK = v => ok(v) ? (Number.isInteger(v)? String(v) : v.toFixed(2)) : '–';
const fMoney = v => !ok(v)?'–': v>=1e9?'$'+(v/1e9).toFixed(1)+'B': v>=1e6?'$'+(v/1e6).toFixed(1)+'M': v>=1e3?'$'+Math.round(v/1e3)+'K':'$'+Math.round(v);
const fExp = e => { const [y,m,d]=e.split('-'); return `${+d} ${MONTHS[+m-1]} ${y.slice(2)}`; };
const fExpN = e => { const [y,m,d]=e.split('-'); return `${d}.${m}.${y.slice(2)}`; };
const fTime = t => new Date(t).toLocaleTimeString('tr-TR',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fDate = t => new Date(t).toLocaleDateString('tr-TR',{timeZone:'America/New_York'});
const iso = d => d.toISOString().slice(0,10);
const dteCache = new Map();
function dteOf(exp){ let v=dteCache.get(exp); if(v==null){ v=Math.max(0,Math.ceil((Date.parse(exp+'T21:00:00Z')-Date.now())/864e5)); dteCache.set(exp,v);} return v; }
const spreadOf = c => (c.bid>0&&c.ask>0) ? (c.ask-c.bid)/((c.ask+c.bid)/2)*100 : null;
const volOiOf = c => (c.oi>0&&c.vol!=null) ? c.vol/c.oi : null;
const uPriceOf = c => c.und===S.und ? S.uPrice : (S.trkU.get(c.und)||{}).price;
const otmOf = c => { const p=uPriceOf(c); return ok(p) ? (c.type==='C'?(c.strike-p):(p-c.strike))/p*100 : null; };
const labelOf = c => `${c.und} ${fExp(c.exp)} ${fK(c.strike)}${c.type}`;
const optTicker = (und,exp,type,k) => `O:${und}${exp.slice(2).replace(/-/g,'')}${type}${String(Math.round(k*1000)).padStart(8,'0')}`;
function parseTicker(t){ const m=/^O:([A-Z.]+?)(\d{2})(\d{2})(\d{2})([CP])(\d{8})$/.exec(t||''); return m?{und:m[1],exp:`20${m[2]}-${m[3]}-${m[4]}`,type:m[5],strike:+m[6]/1000}:null; }
function setCell(td,v,fmt,flash){ const old=td._v; td._v=v; td.textContent=fmt(v);
  if(flash&&ok(old)&&ok(v)&&old!==v){ td.classList.remove('fu','fd'); void td.offsetWidth; td.classList.add(v>old?'fu':'fd'); } }
const num = v => v===''||v==null ? null : +v;
const symSet = s => new Set(String(s||'').toUpperCase().split(/[,\s]+/).filter(Boolean));

/* ---------- status ---------- */
function setStatus(st,text){ const m={demo:['Örnek veri','demo'],loading:['Yükleniyor',''],live:['Canlı','live'],delayed:['15 dk gecikmeli','delayed'],error:['Bağlantı sorunu','err'],paused:['Duraklatıldı','']};
  const [t,c]=m[st]||[st,'']; $('#status').textContent=text||t; $('#dot').className='dot '+c; }
function note(msg,err){ const e=$('#msg'); e.textContent=msg||''; e.className=err?'err':''; }

/* ---------- server API (Massive key stays on the server) ---------- */
async function getJSON(u){
  let r; try{ r=await fetch(u,{credentials:'same-origin',cache:'no-store'}); }catch(e){ throw new Error('Sunucuya ulaşılamadı'); }
  if(r.status===401){ location.href='/login?next='+encodeURIComponent(location.pathname+location.search); throw new Error('Oturum süresi doldu'); }
  if(!r.ok){ let m=r.statusText; try{ const j=await r.json(); m=j.message||j.error||m; }catch(e){} if(r.status===403) m+=' (planın bu veriyi kapsamıyor olabilir)'; throw new Error(`${r.status}: ${m}`); }
  return r.json();
}
function massive(path,params){ const u=new URL('/api/massive',location.origin); u.searchParams.set('path',path);
  if(params) for(const [k,v] of Object.entries(params)) if(v!==''&&v!=null) u.searchParams.set(k,v); return getJSON(u); }
async function fetchChainFor(und,ref,exp,maxC){
  const now=new Date(), p={limit:250};
  if(exp) p.expiration_date=exp; else { p['expiration_date.gte']=iso(now); p['expiration_date.lte']=iso(new Date(now.getTime()+CFG.maxDte*864e5)); }
  if(ok(ref)){ p['strike_price.gte']=(ref*(1-CFG.strikePct/100)).toFixed(2); p['strike_price.lte']=(ref*(1+CFG.strikePct/100)).toFixed(2); }
  let j=await massive(`v3/snapshot/options/${und}`,p); const out=[...(j.results||[])]; let n=1;
  while(j.next_url && out.length<(maxC||CFG.maxContracts) && n<60){ j=await getJSON(new URL(j.next_url,location.origin)); out.push(...(j.results||[])); n++; }
  return out;
}
const fetchChain = exp => fetchChainFor(S.und, S.uPrice, exp);
function ingestOption(r,map){
  const d=r.details||{}, t=d.ticker; if(!t) return null;
  let c=map.get(t); if(!c){ const pt=parseTicker(t)||{}; c={t,und:pt.und||S.und,type:d.contract_type==='put'?'P':'C',strike:d.strike_price,exp:d.expiration_date}; map.set(t,c); }
  const q=r.last_quote||{}, tr=r.last_trade||{}, g=r.greeks||{}, day=r.day||{};
  let ch=0; const set=(k,v)=>{ if(v!=null&&isFinite(v)&&c[k]!==v){ c[k]=v; ch++; } };
  set('bid',q.bid); set('ask',q.ask); set('mid',q.midpoint ?? ((q.bid!=null&&q.ask!=null)?(q.bid+q.ask)/2:null)); set('last',tr.price ?? day.close);
  set('vol',day.volume); set('oi',r.open_interest); set('iv',r.implied_volatility);
  set('delta',g.delta); set('gamma',g.gamma); set('theta',g.theta); set('vega',g.vega);
  set('chgPct',day.change_percent); set('be',r.break_even_price);
  if(q.timeframe) S.delayed = q.timeframe!=='REAL-TIME';
  const ua=r.underlying_asset; if(ua&&ok(ua.price)){ c.spot=ua.price; if(c.und===S.und && !S.stocks.get(S.und)?.price) S.uPrice=ua.price; const u=S.trkU.get(c.und)||{}; u.price=ua.price; S.trkU.set(c.und,u); }
  if(ch){ S.upd+=ch; S.dirty.add(t); }
  return c;
}

/* ---------- stocks ---------- */
const watchList = () => [...new Set(P.watch.split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean).concat([S.und]))];
function ingestStock(t){ const sym=t.ticker; if(!sym) return; let s=S.stocks.get(sym); if(!s){ s={sym}; S.stocks.set(sym,s); }
  const lt=t.lastTrade||{}, lq=t.lastQuote||{}, day=t.day||{}, pd=t.prevDay||{}, mn=t.min||{};
  const before=s.price, price=lt.p||mn.c||day.c||pd.c; if(ok(price)) s.price=price;
  if(ok(pd.c)) s.prev=pd.c; if(ok(lq.p)) s.bid=lq.p; if(ok(lq.P)) s.ask=lq.P;
  if(day.v>0) s.vol=day.v; if(day.h>0) s.high=day.h; if(day.l>0) s.low=day.l; if(day.vw>0) s.vwap=day.vw;
  if(before!==s.price) S.upd++; stockDerived(s); }
function stockDerived(s){ if(ok(s.price)&&ok(s.prev)){ s.chg=s.price-s.prev; s.chgPct=s.chg/s.prev*100; }
  if(s.sym===S.und && ok(s.price)){ S.uPrice=s.price; S.uChg=s.chg; S.uChgPct=s.chgPct; }
  const u=S.trkU.get(s.sym); if(u){ u.price=s.price; u.chgPct=s.chgPct; } S.stDirty.add(s.sym); }
async function fetchStocks(){ const syms=[...new Set(watchList().concat(trackedUnderlyings()))];
  const j=await massive('v2/snapshot/locale/us/markets/stocks/tickers',{tickers:syms.join(',')}); (j.tickers||[]).forEach(ingestStock); }

/* ---------- tracked contracts ---------- */
const trackedUnderlyings = () => [...new Set(P.tracked.map(t=>(parseTicker(t)||{}).und).filter(Boolean))];
const isTracked = t => P.tracked.includes(t);
function toggleTrack(t, contract){
  if(isTracked(t)) P.tracked=P.tracked.filter(x=>x!==t);
  else { if(P.tracked.length>=50){ note('En fazla 50 kontrat takip edilebilir.',true); return; } P.tracked.push(t); }
  saveP(true); for(const td of S.starMap.get(t)||[]) paintStar(td,t);
  const r=S.scrRows.get(t); if(r) paintStar(r.star,t);
  if(isTracked(t)){ const c=S.contracts.get(t)||contract; if(c) S.trk.set(t,c); } else S.trk.delete(t);
  S.trkForce=true; updTrkCount(); if(!DEMO) fetchTracked().catch(()=>{}); }
function paintStar(td,t){ const on=isTracked(t); td.textContent=on?'★':'☆'; td.classList.toggle('on',on); td.title=on?'Takipten çıkar':'Takibe al'; }
function starCell(t,contract){ const td=el('td','star'); paintStar(td,t); td.onclick=e=>{ e.stopPropagation(); toggleTrack(t,contract); }; return td; }
function updTrkCount(){ document.querySelector('[data-view=tracked] .tip').textContent=`Takip listem${P.tracked.length?' ('+P.tracked.length+')':''}`; }
async function fetchTracked(){ if(!P.tracked.length||DEMO) return;
  const j=await getJSON('/api/tracked?c='+encodeURIComponent(P.tracked.join(',')));
  (j.results||[]).forEach(r=>ingestOption(r,S.trk));
  if(j.errors&&j.errors.length) note(`${j.errors.length} takip edilen kontrat alınamadı (örn. ${j.errors[0].ticker}: ${j.errors[0].error}).`,true); }

/* ============================================================
   OPTIONS FLOW
   ============================================================ */
const TYPE_KEY = {Sweep:'tSweep',Split:'tSplit',Block:'tBlock'};
const TYPE_CLS = {Sweep:'c-yellow',Split:'c-purple',Block:'c-blue'};
const SIDE_TXT = {AA:'Ask üstü',A:'Ask',M:'Orta',B:'Bid',BB:'Bid altı'};
function flowKey(f){ return f.ticker; }
function addFlow(f,isNew){
  f.id=f.id||(Math.random().toString(36).slice(2)); f.prem=f.size*f.price*100; f.ticker=f.ticker||optTicker(f.sym,f.exp,f.cp,f.strike);
  f.dte=dteOf(f.exp); f.etf=ETFS.has(f.sym);
  f.otm = f.cp==='C' ? (f.strike-f.spot)/f.spot*100 : (f.spot-f.strike)/f.spot*100;
  f.bull = (f.cp==='C'&&(f.side==='A'||f.side==='AA')) || (f.cp==='P'&&(f.side==='B'||f.side==='BB'));
  f.bear = (f.cp==='P'&&(f.side==='A'||f.side==='AA')) || (f.cp==='C'&&(f.side==='B'||f.side==='BB'));
  S.flows.unshift(f); if(S.flows.length>CFG.maxFlows){ const old=S.flows.pop(); const r=S.repeat.get(flowKey(old)); if(r){ r.n--; r.prem-=old.prem; } }
  const r=S.repeat.get(flowKey(f))||{n:0,prem:0}; r.n++; r.prem+=f.prem; S.repeat.set(flowKey(f),r);
  if(isNew){ S.newIds.add(f.id); setTimeout(()=>S.newIds.delete(f.id),1800); }
  S.flowDirty=true; S.upd++;
}
function passFlow(f,F){
  if(F.sym){ const s=symSet(F.sym); if(s.size&&!s.has(f.sym)) return false; }
  if(F.exclude&&symSet(F.exclude).has(f.sym)) return false;
  if(F.watchOnly&&!watchList().includes(f.sym)) return false;
  if(F.stockType==='etf'&&!f.etf) return false; if(F.stockType==='stock'&&f.etf) return false;
  if(num(F.spotMin)!=null&&f.spot<num(F.spotMin)) return false; if(num(F.spotMax)!=null&&f.spot>num(F.spotMax)) return false;
  if(F.earnings!=='any'){ const e=f.earn;
    if(F.earnings==='before_exp'&&!(e!=null&&e<=f.dte)) return false;
    if(F.earnings==='within7'&&!(e!=null&&e<=7)) return false;
    if(F.earnings==='none'&&e!=null&&e<=f.dte) return false; }
  if(F.cp!=='all'&&f.cp!==F.cp) return false;
  if(!F[TYPE_KEY[f.type]||'tOther']) return false;
  if(num(F.minSize)!=null&&f.size<num(F.minSize)) return false;
  if(num(F.minPrice)!=null&&f.price<num(F.minPrice)) return false;
  if(num(F.minPrem)!=null&&f.prem<num(F.minPrem)) return false;
  if(num(F.maxPrem)!=null&&f.prem>num(F.maxPrem)) return false;
  const sd=f.side;
  if(F.side==='ask'&&!(sd==='A'||sd==='AA')) return false; if(F.side==='aboveAsk'&&sd!=='AA') return false;
  if(F.side==='bid'&&!(sd==='B'||sd==='BB')) return false; if(F.side==='belowBid'&&sd!=='BB') return false; if(F.side==='mid'&&sd!=='M') return false;
  if(F.dir==='bull'&&!f.bull) return false; if(F.dir==='bear'&&!f.bear) return false;
  if(num(F.dteMin)!=null&&f.dte<num(F.dteMin)) return false; if(num(F.dteMax)!=null&&f.dte>num(F.dteMax)) return false;
  if(F.money==='otm'&&!(f.otm>0)) return false; if(F.money==='itm'&&!(f.otm<0)) return false;
  if(num(F.otmMin)!=null&&f.otm<num(F.otmMin)) return false; if(num(F.otmMax)!=null&&f.otm>num(F.otmMax)) return false;
  if(F.volGtOi&&!(f.vol>f.oi)) return false;
  if(num(F.volOiMin)!=null&&!(f.oi>0&&f.vol/f.oi>=num(F.volOiMin))) return false;
  if(num(F.oiMin)!=null&&!((f.oi||0)>=num(F.oiMin))) return false;
  const rep=S.repeat.get(flowKey(f))||{n:1,prem:f.prem};
  if(num(F.repeatMin)!=null&&rep.n<num(F.repeatMin)) return false;
  if(num(F.repeatPremMin)!=null&&rep.prem<num(F.repeatPremMin)) return false;
  return true;
}
const FCOLS=[
  {k:'t',h:'Saat (ET)',v:f=>f.t,r:f=>fTime(f.t),cls:()=> 't-dim'},
  {k:'sym',h:'Sembol',v:f=>f.sym,r:f=>f.sym,cls:f=>f.cp==='C'?'c-green':'c-red'},
  {k:'exp',h:'Vade',v:f=>f.exp,r:f=>fExpN(f.exp)},
  {k:'strike',h:'Strike',v:f=>f.strike,r:f=>fK(f.strike),n:1},
  {k:'cp',h:'C / P',v:f=>f.cp,r:f=>f.cp==='C'?'Call':'Put'},
  {k:'spot',h:'Spot',v:f=>f.spot,r:f=>f2(f.spot),n:1},
  {k:'size',h:'Adet',v:f=>f.size,r:f=>fInt(f.size),n:1,cls:f=>f.size>f.oi?'c-cyan':''},

}

const erf=x=>{ const s=Math.sign(x); x=Math.abs(x); const t=1/(1+.3275911*x); return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x)); };

  const price=call?Sp*N(d1)-K*df*N(d2):K*df*N(-d2)-Sp*N(-d1);
  return {price:Math.max(price,.01),delta:call?N(d1):N(d1)-1,gamma:nd(d1)/(Sp*v*Math.sqrt(T)),theta:(-Sp*nd(d1)*v/(2*Math.sqrt(T))+(call?-1:1)*r*K*df*N(call?d2:-d2))/365,vega:Sp*nd(d1)*Math.sqrt(T)/100}; }

const EARN={}; for(const s of Object.keys(UNIV)) EARN[s]=ETFS.has(s)?null:(Math.random()<.85?Math.floor(Math.random()*70):null);

const RND=(a,b)=>a+Math.random()*(b-a);

function genFlow(t){
  let f;
  if(lastDemoFlows.length&&Math.random()<.15){ const b=lastDemoFlows[Math.floor(Math.random()*lastDemoFlows.length)]; f={...b}; delete f.id; }
  else { const sym=pickW(), spot=DSPOT[sym], cp=Math.random()<.56?'C':'P';
    const di=Math.min(DEXPS.length-1,Math.floor(Math.pow(Math.random(),2.2)*DEXPS.length)); const exp=DEXPS[di];
    const step=strikeStep(spot); const k=Math.max(step,Math.round(spot*(1+(cp==='C'?1:-1)*Math.abs(RND(-.04,.12)))/step)*step);
    f={sym,cp,exp,strike:+k.toFixed(2),earn:EARN[sym]}; }

  if(d.brief&&d.brief.text){ brief.appendChild(el('div','brief',d.brief.text));
    const cs=el('div','cites'); for(const c of d.brief.citations||[]){ const u=safeUrl(c.url); if(!u) continue; const a=el('a',null,c.source||c.title); a.href=u; a.target='_blank'; a.rel='noopener noreferrer'; a.title=c.title||''; cs.appendChild(a); } brief.appendChild(cs);
    const n=el('div','c-muted','Exa ile otomatik özetlendi; hatalı olabilir, kaynaklara bak.'); n.style.fontSize='11px'; n.style.marginTop='8px'; brief.appendChild(n); }
  else brief.remove();
  if(d.error&&!(d.articles||[]).length){ box.appendChild(el('div','c-red',d.error)); return; }
  const list=el('div','news'); let n=0;
  for(const a of d.articles||[]){ const u=safeUrl(a.url); if(!u) continue; n++;
    const it=el('a','nitem'); it.href=u; it.target='_blank'; it.rel='noopener noreferrer';
    const src=el('div','src'); const fav=safeUrl(a.favicon); if(fav){ const im=el('img'); im.src=fav; im.alt=''; im.loading='lazy'; im.referrerPolicy='no-referrer'; im.onerror=()=>im.remove(); src.appendChild(im); }
    src.append(el('span',null,a.source||''),el('span',null,a.published?'· '+ago(a.published):''));
    it.append(src,el('div','tt',a.title)); const txt=a.summary||a.highlight; if(txt) it.appendChild(el('div','sm',txt)); list.appendChild(it); }
  box.appendChild(n?list:el('div','c-muted',`Son iki haftada ${sym} ile ilgili haber bulunamadı.`));
}

/* ---------- wiring ---------- */
$('#searchForm').onsubmit=e=>{ e.preventDefault(); const v=$('#tk').value.trim().toUpperCase(); if(!v) return;
  if(cur==='flow'){ P.flow.sym=v; flowChanged(); $('#tk').value=''; } else load(v); };
$('#expSel').onchange=e=>{ S.selExp=e.target.value; buildChain(true); S.lastCharts=0; if(!DEMO) poll(); };
const wi=$('#watchInp'); wi.value=P.watch;
wi.addEventListener('change',()=>{ P.watch=wi.value||PDEF.watch; saveP(true); buildStocks(); if(!DEMO) fetchStocks().catch(()=>{}); });
$('#bigMin').value=P.bigMin; $('#bigMin').onchange=e=>{ P.bigMin=e.target.value; saveP(); renderFeed(); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!DEMO){ poll(); S.scrForce=true; S.lastCharts=0; } });

async function init(){
  buildDrawer(); buildFlowHead(); buildScrHead(); buildTrkHead(); fillScr(); updTrkCount();
  if(!DEMO){
    try{ const c=await getJSON('/api/config'); CFG.pollMs=c.pollMs||CFG.pollMs;
      $('#avatar').textContent=(c.name||c.email||'?').trim()[0].toUpperCase(); $('#avatar').parentNode.title=`${c.email} · Çıkış`;
      if(c.demo) DEMO=true;
      else if(!c.keyConfigured){ setStatus('error'); note('Sunucuda MASSIVE_API_KEY tanımlı değil.',true); } }
    catch(e){ setStatus('error'); note('Sunucu yapılandırması okunamadı: '+e.message,true); return; }
    await cloudLoad();
  }
  paintSaveState(); wi.value=P.watch;
  if(P.defaultPreset&&!P.activePreset) applyPreset(P.defaultPreset);
  renderPresetSel(); flowChanged(); updTrkCount();
  view(P.view||'flow');
  if(DEMO){ setStatus('demo'); note('Örnek veri gösteriliyor: işlemler, fiyatlar ve hacimler gerçek piyasa verisi değildir.'); startDemoFlow(); }
  else { setStatus('loading'); note('Canlı akış, izleme listesindeki hisselerin zincirlerindeki hacim artışlarından türetilir (yaklaşık; sweep/split ayrımı yapılamaz).');
    S.flowTimers.push(setInterval(liveFlowTick,CFG.pollMs)); }
  load(P.und);
}
init();
})();
</script>
